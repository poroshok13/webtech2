<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1 - Geometric Composition (CSS Grid)</title>
  <link rel="stylesheet" href="task1.css">
</head>
<body>
  <header class="header">
    <h1>Task 1: Geometric Composition</h1>
    <p class="subtitle">Single CSS Grid (6×6), pure fluid scaling, black lines from grid-gap</p>
  </header>

  <main class="composition-wrapper">
    <div class="mondrian-grid">
      <div class="block block-blue" aria-label="Blue block"></div>
      <div class="block block-white-top" aria-label="Top white block"></div>
      <div class="block block-yellow" aria-label="Yellow block"></div>
      <div class="block block-white-mid" aria-label="Middle right white block"></div>
      <div class="block block-red" aria-label="Large red block"></div>
      <div class="block block-black" aria-label="Black accent block"></div>
      <div class="block block-white-bot" aria-label="Bottom right white block"></div>
    </div>
  </main>
</body>
</html>
